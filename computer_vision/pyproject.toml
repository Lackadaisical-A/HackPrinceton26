[project]
name = "paul-vision"
version = "0.1.0"
description = "PAUL computer vision module: wrist-camera target guidance published over ZMQ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python>=4.10",
    "cv2-enumerate-cameras>=1.4,<2",
    "openvino>=2026.0",
    "pyyaml>=6",
    "pyzmq>=26",
    "ultralytics>=8.4.212",
]

# PyTorch build selection (see https://docs.astral.sh/uv/guides/integration/pytorch/).
# No extra: torch comes from PyPI, which is the CPU build on Windows. Fine for the Intel laptop.
# Demo machine (NVIDIA): always pass `--extra cu130`, e.g. `uv run --extra cu130 python -m paul_vision`.
[project.optional-dependencies]
cpu = ["torch>=2.11", "torchvision>=0.26"]
cu130 = ["torch>=2.11", "torchvision>=0.26"]

[dependency-groups]
dev = ["pytest>=8"]
# Only needed to bake text prompts into a model (python -m paul_vision.bake). Needs git.
bake = ["clip @ git+https://github.com/ultralytics/CLIP.git"]

[tool.uv]
default-groups = ["dev", "bake"]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
