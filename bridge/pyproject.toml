[project]
name = "paul-bridge"
version = "0.1.0"
description = "PAUL console bridge: relays the ZMQ topics to the web console over a WebSocket, and its commands back"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyzmq>=26",
    "websockets>=15",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
